<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAW Web Viewer — Ethereum (community deployment)</title>
<meta name="description" content="Web viewer for the community CAW deployment on Ethereum: timeline, names and profiles from public nodes; connect MetaMask to post, like and recaw.">
<link rel="icon" type="image/jpeg" href="assets/logo.jpg">
<script>
  if (localStorage.getItem("guppy-theme") === "dark") document.documentElement.dataset.theme = "dark";
</script>
<style>
  :root, :root[data-theme="light"] {
    --bg: #ffffff; --text: #0f1419; --muted: #536471; --accent: #1d9bf0; --accent-hover: #1a8cd8;
    --border: #eff3f4; --border-strong: #cfd9de; --hover: rgba(15,20,25,.03); --active-bg: rgba(15,20,25,.06);
    --card-bg: #f7f9f9; --search-bg: #eff3f4; --like: #f91880; --recaw: #00ba7c;
    --bg-blur: rgba(255,255,255,.85); --banner: #cfd9de;
    --cell-hover: #f7f9f9; --nav-hover: rgba(15,20,25,.1); --row-hover: #eff3f4;
    --tint-blue: rgba(29,155,240,.1); --tint-green: rgba(0,186,124,.1); --tint-pink: rgba(249,24,128,.1);
  }
  :root[data-theme="dark"] {
    --bg: #000000; --text: #e7e9ea; --muted: #71767b; --accent: #1d9bf0; --accent-hover: #1a8cd8;
    --border: #2f3336; --border-strong: #536471; --hover: rgba(231,233,234,.03); --active-bg: rgba(231,233,234,.08);
    --card-bg: #16181c; --search-bg: #202327; --like: #f91880; --recaw: #00ba7c;
    --bg-blur: rgba(0,0,0,.65); --banner: #333639;
    --cell-hover: rgba(255,255,255,.03); --nav-hover: rgba(231,233,234,.1); --row-hover: #1d1f23;
    --tint-blue: rgba(29,155,240,.1); --tint-green: rgba(0,186,124,.1); --tint-pink: rgba(249,24,128,.1);
  }
  * { box-sizing: border-box; }
  html { scrollbar-gutter: stable; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", Helvetica, Arial, sans-serif; line-height: 1.45; font-size: 15px; letter-spacing: normal; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  .hidden { display: none !important; }

  .shell { display: grid; grid-template-columns: 275px minmax(0,600px) 350px; column-gap: 20px; max-width: 1265px; margin: 0 auto; }

  /* ---------- left sidebar ---------- */
  .sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 6px 12px 16px; overflow-y: auto; }
  .logo-row { display: flex; align-items: center; gap: 12px; padding: 8px 12px; }
  .logo-img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; display: block; }
  .logo-word { font-size: 20px; font-weight: 800; letter-spacing: normal; }
  .logo-word small { display: block; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
  .snav { margin-top: 4px; display: flex; flex-direction: column; gap: 2px; }
  .snav a { display: flex; align-items: center; gap: 20px; padding: 12px; border-radius: 999px; color: var(--text); font-size: 20px; line-height: 24px; width: fit-content; max-width: 100%; }
  .snav a:hover { background: var(--nav-hover); text-decoration: none; }
  .snav a.on { font-weight: 800; }
  .snav svg { width: 26.5px; height: 26.5px; flex: none; }
  .snav .lbl { padding-right: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .getapp { margin-top: 16px; display: block; text-align: center; background: var(--accent); color: #fff; font-weight: 700; font-size: 17px; border-radius: 999px; padding: 14px 20px; width: 90%; box-shadow: 0 4px 14px rgba(29,155,240,.25); }
  .getapp:hover { background: var(--accent-hover); text-decoration: none; }
  .side-bottom { margin-top: auto; padding: 14px 10px 0; }
  .nodebox { display: flex; gap: 9px; align-items: flex-start; font-size: 13px; color: var(--muted); }
  .nodebox .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; margin-top: 5px; }
  .nodebox.on .dot { background: var(--recaw); }
  .nodebox .host { font-weight: 700; color: var(--text); word-break: break-all; }
  .nodebox .retry { color: var(--accent); font-weight: 700; padding: 0; font-size: 13px; }
  .side-controls { display: flex; gap: 6px; margin-top: 12px; }
  .side-controls button { font-size: 13px; font-weight: 700; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 6px 13px; }
  .side-controls button:hover { background: var(--hover); color: var(--text); }

  /* ---------- center column ---------- */
  .center { border-left: 1px solid var(--border); border-right: 1px solid var(--border); min-height: 100vh; min-width: 0; }
  .center-header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 0 16px; height: 54px; background: var(--bg-blur); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .center-header .ttl { font-size: 20px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drawer-btn { display: none; width: 34px; height: 34px; border-radius: 50%; overflow: hidden; flex: none; padding: 0; margin-left: -6px; }
  .drawer-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .backbtn { display: none; width: 34px; height: 34px; border-radius: 50%; align-items: center; justify-content: center; flex: none; margin-left: -8px; }
  .backbtn:hover { background: var(--hover); }
  .backbtn.show { display: flex; }
  .backbtn svg { width: 20px; height: 20px; }

  .ro-card { margin: 12px 16px; background: var(--card-bg); border-radius: 16px; padding: 14px 16px; font-size: 14px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .ro-badge { background: var(--accent); color: #fff; border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 800; flex: none; }
  .ro-card a { font-weight: 700; }

  .state-box { padding: 48px 32px; text-align: left; }
  .state-box h2 { font-size: 29px; font-weight: 800; margin: 0 0 10px; line-height: 1.25; }
  .state-box p { color: var(--muted); margin: 0 0 12px; font-size: 15px; }
  .state-box.center { text-align: center; border: none; min-height: 0; }
  .err { color: #f4212e; }

  /* ---------- post cells ---------- */
  .post { padding: 12px 16px 6px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .post:hover { background: var(--cell-hover); }
  .ctx-line { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 700; margin: 0 0 4px 26px; }
  .ctx-line svg { width: 15px; height: 15px; }
  .reply-line { color: var(--muted); font-size: 14px; margin-bottom: 2px; }
  .reply-line .mention { color: var(--accent); }
  .post-row { display: flex; gap: 10px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; color: #fff; overflow: hidden; cursor: pointer; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .post-main { flex: 1; min-width: 0; }
  .post-head { display: flex; align-items: baseline; gap: 5px; min-width: 0; }
  .pname { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .pname:hover { text-decoration: underline; }
  .phandle { color: var(--muted); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .post-body { white-space: pre-wrap; word-break: break-word; font-size: 15px; line-height: 20px; margin-top: 1px; }
  .post-body a, .mention { color: var(--accent); }
  .mention { cursor: pointer; }
  .mention:hover { text-decoration: underline; }
  .quote-embed { border: 1px solid var(--border-strong); border-radius: 16px; padding: 10px 12px; margin-top: 10px; cursor: pointer; }
  .quote-embed:hover { background: var(--hover); }
  .quote-embed .post-body { font-size: 14px; }
  .quote-embed .avatar { width: 20px; height: 20px; font-size: 10px; }
  .quote-head { display: flex; align-items: center; gap: 5px; }
  .actions { display: flex; align-items: center; justify-content: space-between; max-width: 425px; margin: 5px 0 3px -7px; color: var(--muted); }
  .act { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; padding: 5px 7px; line-height: 1; }
  .act .ic { position: relative; display: inline-flex; flex: none; }
  .act .ic::before { content: ""; position: absolute; inset: -8px; border-radius: 50%; transition: background-color .2s; }
  .act svg { width: 18.5px; height: 18.5px; position: relative; }
  .act i { font-style: normal; min-width: 8px; }
  .act.reply:hover, .act.views:hover { color: var(--accent); }
  .act.reply:hover .ic::before, .act.views:hover .ic::before { background: var(--tint-blue); }
  .act.recaw:hover { color: var(--recaw); }
  .act.recaw:hover .ic::before { background: var(--tint-green); }
  .act.like:hover { color: var(--like); }
  .act.like:hover .ic::before { background: var(--tint-pink); }
  .act.like.on { color: var(--like); }
  .act.recaw.on { color: var(--recaw); }
  button.act.bm { color: var(--muted); }
  button.act.bm:hover { color: var(--accent); }
  button.act.bm:hover .ic::before { background: var(--tint-blue); }
  button.act.bm.on { color: var(--accent); }
  .showmore { display: block; width: 100%; text-align: center; color: var(--accent); font-size: 15px; padding: 16px; border-bottom: 1px solid var(--border); }
  .showmore:hover { background: var(--hover); }
  .showmore:disabled { color: var(--muted); cursor: default; background: none; }

  /* ---------- thread ---------- */
  .thread-post { padding: 14px 16px 6px; border-bottom: 1px solid var(--border); }
  .thread-post .avatar { width: 40px; height: 40px; }
  .thead-names { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .thead-names .pname { font-size: 15px; }
  .thead-names .phandle { flex: none; }
  .thread-body { font-size: 17px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; margin-top: 12px; }
  .thread-meta { color: var(--muted); font-size: 15px; margin-top: 14px; padding-bottom: 4px; }
  .thread-meta b { color: var(--text); }
  .thread-post .actions { max-width: none; margin: 8px -7px 0; padding: 5px 0 3px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }

  /* ---------- profile ---------- */
  .banner { height: 200px; background: var(--banner); }
  .prof-pad { padding: 0 16px; }
  .prof-avatar { width: 133px; height: 133px; border-radius: 50%; border: 4px solid var(--bg); margin-top: -66px; font-size: 48px; display: flex; align-items: center; justify-content: center; color: #fff; overflow: hidden; background: var(--card-bg); position: relative; z-index: 1; }
  .prof-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .prof-name { font-size: 20px; font-weight: 800; margin-top: 8px; }
  .prof-handle { color: var(--muted); font-size: 15px; }
  .deposit-card { display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; margin-top: 14px; }
  .deposit-card img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; }
  .deposit-card .dk { color: var(--muted); font-size: 13px; }
  .deposit-card .dv { font-size: 19px; font-weight: 800; }
  .prof-stats { display: flex; gap: 20px; margin-top: 14px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
  .prof-stats b { color: var(--text); font-size: 15px; }
  .prof-tabs { display: flex; margin-top: 14px; border-bottom: 1px solid var(--border); }
  .prof-tabs button { flex: 1; padding: 15px 4px; font-size: 15px; font-weight: 500; color: var(--muted); position: relative; }
  .prof-tabs button:hover { background: var(--hover); }
  .prof-tabs button.on { font-weight: 800; color: var(--text); }
  .prof-tabs button.on::after { content: ""; position: absolute; left: 50%; transform: translateX(-50%); bottom: 0; width: 56px; height: 4px; border-radius: 999px; background: var(--accent); }

  /* ---------- explore / names ---------- */
  .explore-search { padding: 12px 16px 4px; }
  .searchbox { display: flex; align-items: center; gap: 10px; background: var(--search-bg); border: 1px solid transparent; border-radius: 999px; padding: 11px 16px; }
  .searchbox:focus-within { background: var(--bg); border-color: var(--accent); }
  .searchbox:focus-within svg { color: var(--accent); }
  .searchbox svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
  .searchbox input { flex: 1; border: none; background: none; color: var(--text); font: inherit; font-size: 15px; outline: none; min-width: 0; }
  .sec-title { font-size: 19px; font-weight: 800; padding: 14px 16px 6px; }
  .namerow { display: flex; align-items: center; gap: 10px; padding: 12px 16px; cursor: pointer; }
  .namerow:hover { background: var(--cell-hover); }
  .namerow .nm { min-width: 0; flex: 1; }
  .namerow .nm .pname { display: block; }
  .namerow .sub { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .viewbtn { flex: none; background: var(--text); color: var(--bg); font-weight: 700; font-size: 14px; border-radius: 999px; padding: 7px 16px; }
  .bm-note { padding: 12px 16px; color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--border); }

  /* ---------- right rail ---------- */
  .rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 6px 0 24px; scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .rail .searchbox { margin-bottom: 14px; }
  .rail-card { background: var(--card-bg); border-radius: 16px; padding: 14px 0 8px; margin-bottom: 16px; overflow: hidden; }
  .rail-card h2 { font-size: 20px; font-weight: 800; margin: 0; padding: 0 16px 8px; }
  .rail-card .namerow { padding: 10px 16px; }
  .rail-card .namerow:hover { background: var(--row-hover); }
  .rail .showmore { border-bottom: none; text-align: left; padding: 12px 16px; }
  .about-logo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
  .about-body { padding: 0 16px; font-size: 14px; color: var(--muted); }
  .about-body p { margin: 8px 0; }
  .about-links { padding: 2px 16px 10px; font-size: 14px; font-weight: 700; display: flex; flex-direction: column; gap: 6px; }
  .rail-foot { color: var(--muted); font-size: 13px; padding: 0 16px; line-height: 1.9; }
  .rail-foot a { color: var(--muted); }
  .rail-foot a:hover { text-decoration: underline; }

  /* ---------- session / compose (MetaMask actions) ---------- */
  #sideSession { margin-top: 14px; }
  .connectbtn { display: block; width: 90%; text-align: center; border: 1px solid var(--accent); color: var(--accent); font-weight: 700; font-size: 15px; border-radius: 999px; padding: 11px 18px; }
  .connectbtn:hover { background: var(--tint-blue); }
  .connectbtn:disabled { opacity: .55; cursor: default; }
  .drawer .connectbtn { width: 100%; }
  .sess-note { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 4px 2px 10px; }
  .sess-note a { font-weight: 700; }
  .userchip { display: flex; gap: 10px; align-items: flex-start; padding: 4px 2px; }
  .userchip .uc-main { flex: 1; min-width: 0; }
  .userchip .uc-name { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .userchip .uc-handle { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .userchip .uc-dep { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .userchip .uc-dep b { color: var(--text); }
  .sess-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .postbtn { background: var(--accent); color: #fff; font-weight: 700; font-size: 15px; border-radius: 999px; padding: 9px 22px; }
  .postbtn:hover { background: var(--accent-hover); }
  .postbtn:disabled { opacity: .5; cursor: default; background: var(--accent); }
  .ghostbtn { border: 1px solid var(--border-strong); color: var(--text); font-weight: 700; font-size: 14px; border-radius: 999px; padding: 8px 16px; }
  .ghostbtn:hover { background: var(--hover); }
  .compose { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); }
  .compose textarea, .replybox textarea { width: 100%; border: none; resize: none; background: none; color: var(--text); font: inherit; font-size: 17px; line-height: 1.4; outline: none; padding: 6px 0 2px; }
  .compose textarea::placeholder, .replybox textarea::placeholder { color: var(--muted); }
  .compose-foot { display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--border); padding-top: 10px; margin-top: 6px; }
  .cost-line { flex: 1; min-width: 0; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
  .charwrap { display: inline-flex; align-items: center; gap: 6px; flex: none; }
  .ring { width: 26px; height: 26px; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 2.5; }
  .ring .ring-bg { stroke: var(--border); }
  .ring .ring-fg { stroke: var(--accent); stroke-linecap: round; }
  .ring.over .ring-fg { stroke: #f4212e; }
  .charnum { font-size: 13px; color: var(--muted); min-width: 18px; text-align: right; }
  .charnum.over { color: #f4212e; }
  .compose-msg { font-size: 13.5px; margin-top: 8px; }
  .replybox { padding: 12px 16px 10px; border-bottom: 1px solid var(--border); }
  .replybox .compose-foot { border-top: none; padding-top: 4px; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); font-size: 14px; padding: 11px 18px; border-radius: 10px; z-index: 200; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; max-width: min(92vw, 480px); text-align: center; box-shadow: 0 8px 28px rgba(0,0,0,.3); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- mobile drawer (X app nav-drawer pattern) ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(91,112,131,.4); z-index: 110; opacity: 0; pointer-events: none; transition: opacity .28s ease; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; left: 0; bottom: 0; width: min(320px, 85vw); background: var(--bg); z-index: 120; transform: translateX(-106%); transition: transform .28s ease; display: flex; flex-direction: column; padding: 16px 16px 20px; overflow-y: auto; box-shadow: 0 0 24px rgba(0,0,0,.28); }
  .drawer.open { transform: translateX(0); }
  .drawer-head { padding: 4px 8px 6px; }
  .drawer-logo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; display: block; }
  .drawer-name { font-weight: 800; font-size: 17px; margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drawer-handle { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drawer-counts { margin-top: 10px; font-size: 14px; color: var(--muted); display: flex; gap: 18px; }
  .drawer-counts b { color: var(--text); font-size: 15px; }
  .dnav { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 8px; display: flex; flex-direction: column; }
  .dnav a { display: flex; align-items: center; gap: 18px; padding: 15px 8px; margin: 0 -8px; border-radius: 12px; color: var(--text); font-size: 20px; font-weight: 700; }
  .dnav a:hover { background: var(--hover); text-decoration: none; }
  .dnav a.on { font-weight: 800; }
  .dnav svg { width: 26px; height: 26px; flex: none; }
  .drawer-controls { margin-top: auto; padding-top: 16px; }
  @media (max-width: 1279px) {
    .shell { grid-template-columns: 72px minmax(0,600px) 320px; column-gap: 12px; max-width: 1030px; }
    .sidebar { padding: 6px 6px 16px; align-items: center; }
    .snav a { padding: 12px; gap: 0; }
    .snav .lbl, .logo-word, .getapp, .nodebox .txt, .side-controls { display: none; }
    .side-bottom { padding: 14px 0 0; }
    .nodebox { justify-content: center; }
  }
  @media (max-width: 1023px) {
    .shell { grid-template-columns: 72px minmax(0,600px); max-width: 690px; }
    .rail { display: none; }
  }
  @media (max-width: 699px) {
    .shell { grid-template-columns: minmax(0,1fr); max-width: none; }
    .sidebar { display: none; }
    .drawer-btn { display: block; }
    .center { border-left: none; border-right: none; }
    .banner { height: 130px; }
    .prof-avatar { width: 84px; height: 84px; margin-top: -42px; font-size: 30px; border-width: 3px; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="sidebar">
    <div class="logo-row">
      <img class="logo-img" src="assets/logo.jpg" alt="CAW">
      <div class="logo-word">CAW<small id="brandSub"></small></div>
    </div>
    <nav class="snav" id="sideNav">
      <a href="#/" data-nav="home"><span data-icon="home"></span><span class="lbl" id="navHome"></span></a>
      <a href="#/explore" data-nav="explore"><span data-icon="search"></span><span class="lbl" id="navExplore"></span></a>
      <a href="#/bookmarks" data-nav="bookmarks"><span data-icon="bookmark"></span><span class="lbl" id="navBookmarks"></span></a>
      <a href="https://ql1-infinite42-guppy-histoire.github.io/eth-caw/" target="_blank" rel="noopener"><span data-icon="smartphone"></span><span class="lbl" id="navOpenApp"></span></a>
    </nav>
    <a class="getapp" href="https://ql1-infinite42-guppy-histoire.github.io/eth-caw/" target="_blank" rel="noopener" id="getAppBtn"></a>

/* ---- formatting ---- */
function fmtRel(iso) {
  var d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  var sec = Math.floor((Date.now() - d.getTime()) / 1000);
  if (sec < 45) return lang === "jp" ? "今" : "now";
  var min = Math.floor(sec / 60);
  if (min < 60) return lang === "jp" ? min + "分" : min + "m";
  var hr = Math.floor(min / 60);
  if (hr < 24) return lang === "jp" ? hr + "時間" : hr + "h";
  var day = Math.floor(hr / 24);
  if (day < 7) return lang === "jp" ? day + "日" : day + "d";
  var opts = { month: "short", day: "numeric" };
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
  return d.toLocaleDateString(lang === "jp" ? "ja-JP" : "en-US", opts);
}
var MONTHS_EN = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function fmtCount(n) {
  n = Number(n) || 0;
  if (n < 1000) return String(n);
  if (n < 1000000) { var k = n / 1000; return (k >= 100 ? Math.round(k) : Math.round(k * 10) / 10) + "K"; }
  var m = n / 1000000;
  return (m >= 100 ? Math.round(m) : Math.round(m * 10) / 10) + "M";
}
function fmtThreadMeta(item) {
  var d = new Date(item.timestamp);
  if (isNaN(d.getTime())) return "";
  var p2 = function (n) { return String(n).padStart(2, "0"); };
  return p2(d.getHours()) + ":" + p2(d.getMinutes()) + " · " +
    d.getFullYear() + "/" + p2(d.getMonth() + 1) + "/" + p2(d.getDate());
}
function fmtCaw(weiStr) {
  if (weiStr == null || weiStr === "") return null;
  try {
    var w = BigInt(weiStr);
    var whole = w / 1000000000000000000n;
    var frac = w % 1000000000000000000n;
    if (frac === 0n) return whole.toLocaleString("en-US") + " CAW";
    var f = Number(w) / 1e18;
    return f.toLocaleString("en-US", { maximumFractionDigits: 2 }) + " CAW";
  } catch (e) { return null; }
}
var AVATAR_COLORS = ["#1d9bf0", "#7856ff", "#f91880", "#00ba7c", "#ff7a00", "#e0245e", "#0f7ae5", "#17bf63"];
function avatarColor(seed) {
  var s = String(seed || "?"), h = 0;
  for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function avatarHtml(user, cls) {
  user = user || {};
  var url = null;
  if (user.avatarUrl && /^https?:\/\//.test(user.avatarUrl)) url = user.avatarUrl;
  else if (user.image && /^https?:\/\//.test(user.image)) url = user.image;
  else if (user.image && user.image.indexOf("<svg") === 0) url = "data:image/svg+xml;utf8," + encodeURIComponent(user.image);
  var uname = user.username || "";
  var click = uname ? ' data-open-user="' + esc(uname) + '"' : "";
  if (url) return '<div class="avatar ' + (cls || "") + '"' + click + '><img alt="" src="' + esc(url) + '"></div>';
  var ch = (user.username || user.displayName || "?").charAt(0).toUpperCase();
  return '<div class="avatar ' + (cls || "") + '" style="background:' + avatarColor(user.username || user.tokenId) + '"' + click + ">" + esc(ch) + "</div>";
}
function displayName(user) {
  user = user || {};
  return user.displayName || user.username || ("#" + (user.tokenId || "?"));
}
function linkify(text) {
  var out = esc(text);
  out = out.replace(/https?:\/\/[^\s<]+/g, function (u) {
    return '<a href="' + u + '" target="_blank" rel="noopener nofollow">' + u + "</a>";
  });
  out = out.replace(/(^|\s)@([a-z0-9_]{2,32})/gi, function (m, pre, name) {
    return pre + '<span class="mention" data-open-user="' + name + '">@' + name + "</span>";
  });
  return out;
}

/* ---- bookmarks: localStorage only, snapshots of the post payload ---- */
var BM_KEY = "ethcaw-web-bookmarks";
var postCache = {}; // effective post id -> shaped caw item (as rendered)
function loadBookmarks() {
  try {
    var arr = JSON.parse(localStorage.getItem(BM_KEY) || "[]");
    return Array.isArray(arr) ? arr.filter(function (b) { return b && b.id && b.item; }) : [];
  } catch (e) { return []; }
}
function saveBookmarks(list) {
  try { localStorage.setItem(BM_KEY, JSON.stringify(list)); } catch (e) {}
}
function isBookmarked(id) {
  return loadBookmarks().some(function (b) { return String(b.id) === String(id); });
}
function toggleBookmark(id) {
  var list = loadBookmarks();
  var idx = -1;
  for (var i = 0; i < list.length; i++) if (String(list[i].id) === String(id)) { idx = i; break; }
  if (idx >= 0) list.splice(idx, 1);
  else if (postCache[id]) list.unshift({ id: String(id), item: postCache[id], savedAt: Date.now() });
  saveBookmarks(list);
  return idx < 0;
}
function refreshBookmarkButtons(id) {
  var on = isBookmarked(id);
  document.querySelectorAll('[data-bookmark="' + CSS.escape(String(id)) + '"]').forEach(function (btn) {
    btn.classList.toggle("on", on);
    btn.innerHTML = '<span class="ic">' + icon("bookmark", on) + "</span>";
  });
}

  try { if (sess) localStorage.setItem(SESS_KEY, JSON.stringify(sess)); else localStorage.removeItem(SESS_KEY); } catch (e) {}
}
function restoreSess(node) {
  try {
    var s = JSON.parse(localStorage.getItem(SESS_KEY) || "null");
    if (s && s.node === node && s.address && s.expiresAt > Date.now()) { sess = s; return true; }
  } catch (e) {}
  return false;
}

/* smltxt.js (524 KB table) loads only when a connected user needs it. */
function ensureSml() {
  if (window.smlCompressText) return Promise.resolve();
  if (ensureSml.p) return ensureSml.p;
  ensureSml.p = new Promise(function (resolve, reject) {
    var s = document.createElement("script");
    s.src = "assets/smltxt.js";
    s.onload = function () { resolve(); };
    s.onerror = function () { reject(new Error("smltxt load failed")); };
    document.head.appendChild(s);
  });
  return ensureSml.p;
}

/* api.ts getValidatorTip(): the node proposes the tip, the user's
   signature pays it — never sign more than the cap. */
function fetchValidatorTip() {
  return fetchJson(state.node + "/api/validator-analytics/tip-config", 8000).then(function (body) {
    var tip = BigInt(body && body.baseTip != null ? body.baseTip : 1000);
    if (tip > MAX_VALIDATOR_TIP) tip = MAX_VALIDATOR_TIP;
    tipCache = tip;
    return tip;
  });
}
function tipForDisplay() { return tipCache != null ? tipCache : 1000n; }
function costLineText(isReply) {
  var fmt = isReply ? t().replyCostFmt : t().costFmt;
  return fmt.replace("{C}", POST_COST_CAW.toLocaleString("en-US")).replace("{T}", Number(tipForDisplay()).toLocaleString("en-US"));
}

/* actions.ts nextCawonceOnChain(): the chain is the only trustworthy
   cawonce source — read straight from CawActions on Base. */
function nextCawonceOnChain(id) {
  var data = NEXT_CAWONCE_SELECTOR + Number(id).toString(16).padStart(64, "0");
  return fetch(L2_RPC_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "eth_call", params: [{ to: CAW_ACTIONS_L2, data: data }, "latest"] }),
  }).then(function (r) { return r.json(); }).then(function (j) {
    if (!j || !j.result) throw new Error("nextCawonce read failed");
    return Number(BigInt(j.result));
  });
}

/* actions.ts signAndSubmit() + api.ts submitAction(), mirrored.
   On HTTP 409 cawonce_collision the node returns suggestedCawonce —
   re-sign once with it, then give up plainly. */
function signAndSubmitAction(draft) {
  return ensureSml().then(function () { return fetchValidatorTip(); }).then(function (tip) {
    return nextCawonceOnChain(senderId()).then(function (cawonce) {
      return submitSignedAction(draft, tip, cawonce, false);
    });
  });
}
function submitSignedAction(draft, tip, cawonce, retried) {
  var data = { // actions.ts `data` — field-for-field
    actionType: draft.actionType,
    senderId: senderId(),
    receiverId: draft.receiverId != null ? draft.receiverId : 0,
    receiverCawonce: draft.receiverCawonce != null ? draft.receiverCawonce : 0,
    networkId: CAW_NETWORK_ID,
    cawonce: cawonce,
    recipients: [],
    amounts: [tip.toString()],
    text: draft.text ? window.smlCompressText(draft.text) : "0x",
  };
  var typedData = {
    types: { EIP712Domain: EIP712_DOMAIN_TYPE, ActionData: ACTION_TYPES.ActionData },
    primaryType: "ActionData",
    domain: ACTION_DOMAIN,
    message: data,
  };
  return window.ethereum.request({
    method: "eth_signTypedData_v4",
    params: [sess.address, JSON.stringify(typedData)],
  }).then(function (signature) {
    var payload = { data: data, domain: ACTION_DOMAIN, types: ACTION_TYPES, signature: signature }; // api.ts submitAction() body
    return fetch(state.node + "/api/actions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify(payload),
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) {
        if (res.status === 409 && body && body.suggestedCawonce != null && !retried) {
          return submitSignedAction(draft, tip, Number(body.suggestedCawonce), true);
        }
        if (res.status !== 201 && res.status !== 200) {
          throw new Error((body && (body.error || body.message)) || ("HTTP " + res.status));
        }
        return body;
      });
    });
  });
}

/* api.ts verifyWallet(): personal_sign the ownership message, POST it,
   keep the cookie session the browser stores. 202 = IndexingError. */
function connectWallet() {
  if (!window.ethereum || !state.node || sessBusy) return;
  sessBusy = true; sessError = ""; sessIndexing = false;
  renderSessionUI();
  var address = null;
  window.ethereum.request({ method: "eth_requestAccounts" }).then(function (accounts) {
    address = accounts && accounts[0];
    if (!address) throw new Error("no account");
    var ts = Math.floor(Date.now() / 1000);
    var message = "Verify wallet ownership for CAW\nHost: " + hostOf(state.node) + "\nChainId: " + L2_CHAIN_ID + "\nTimestamp: " + ts;
    return window.ethereum.request({ method: "personal_sign", params: [message, address] }).then(function (signature) {
      return fetch(state.node + "/api/auth/verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ message: message, signature: signature }),
      }).then(function (res) {
        if (res.status === 202) { sessIndexing = true; return null; }
        if (!res.ok) throw new Error(t().verifyFailed + " (HTTP " + res.status + ")");
        return res.json();
      }).then(function (body) {
        if (!body) return; // indexing path
        sess = {
          address: address,
          authorizedTokenIds: body.authorizedTokenIds || [],
          expiresAt: body.expiresAt || Date.now() + 24 * 3600 * 1000,
          node: state.node,
        };
        saveSess();
        return loadSessUser().then(function () {
          fetchValidatorTip().catch(function () {});
          ensureSml().then(function () {
            setTimeout(function () { try { window.smlCompressText(""); } catch (e) {} }, 600);
          }).catch(function () {});
        });
      });
    });
  }).catch(function (e) {
    sessError = (e && e.message) || t().verifyFailed;
  }).finally(function () {
    sessBusy = false;
    renderSessionUI();
    refreshView();
  });
}
function disconnectWallet() {
  // api.ts has no logout endpoint — disconnecting clears local state;
  // the node's cookie simply stops being used by this page.
  sess = null; sessUser = null; sessCounts = null; sessIndexing = false; sessError = "";
  saveSess();
  renderSessionUI();
  refreshView();
}
function loadSessUser() {
  var id = senderId();
  if (id == null || !state.node) { sessUser = null; return Promise.resolve(); }
  return api("/api/users/by-token/" + encodeURIComponent(id)).then(function (b) {
    sessUser = (b && (b.user || b)) || null;
    if (sessUser && sessUser.username) {
      return api("/api/users/" + encodeURIComponent(sessUser.username)).then(function (p) {
        var u = (p && (p.user || p)) || {};
        if (typeof u.followingCount === "number" && typeof u.followerCount === "number") {
          sessCounts = { following: u.followingCount, followers: u.followerCount };
        }
      }).catch(function () {});
    }
  }).catch(function () { sessUser = null; });
}

/* ---------- live like / recaw from post cells ---------- */
function actTarget(btn, attr) {
  var id = btn.getAttribute(attr);
  var eff = postCache[id];
  if (!eff) return null;
  if (eff.cawonce == null || !eff.user || eff.user.tokenId == null) {
    showToast(t().actUnavailable);
    return null;
  }
  return eff;
}
function onLikeAct(btn) {
  if (btn.dataset.busy) return;
  var eff = actTarget(btn, "data-like");
  if (!eff) return;
  var unlike = !!eff.hasLiked; // actions.ts likeAction(): type 1 like / 2 unlike
  btn.dataset.busy = "1";
  signAndSubmitAction({
    actionType: unlike ? 2 : 1,
    receiverId: eff.user.tokenId,
    receiverCawonce: eff.cawonce,
  }).then(function () {
    eff.hasLiked = !unlike;
    eff.likeCount = Math.max(0, (eff.likeCount || 0) + (unlike ? -1 : 1));
    refreshView();
  }).catch(function (e) {
    showToast((e && e.message) || t().actFailed);
  }).finally(function () { delete btn.dataset.busy; });
}
function onRecawAct(btn) {
  if (btn.dataset.busy) return;
  var eff = actTarget(btn, "data-recaw");
  if (!eff) return;
  if (eff.hasRecawed) return; // the protocol app has no un-recaw
  btn.dataset.busy = "1";
  signAndSubmitAction({ // actions.ts recawAction(): type 3
    actionType: 3,
    receiverId: eff.user.tokenId,
    receiverCawonce: eff.cawonce,
  }).then(function () {
    eff.hasRecawed = true;
    eff.recawCount = (eff.recawCount || 0) + 1;
    refreshView();
  }).catch(function (e) {
    showToast((e && e.message) || t().actFailed);
  }).finally(function () { delete btn.dataset.busy; });
}

/* ---------- node discovery (unchanged behavior) ---------- */
function probeNode(url) {
  var base = url.replace(/\/+$/, "");
  return fetchJson(base + "/api/instances", 5000).then(function (info) {
    if (info && typeof info.networkId === "number" && info.networkId === EXPECTED_NETWORK_ID) return base;
    throw new Error("unexpected networkId");
  });
}
function discover() {
  var forced = null;
  try { forced = new URLSearchParams(location.search).get("node"); } catch (e) {}
  var jobs;
  if (forced) {
    jobs = [Promise.resolve([forced])];
  } else {
    var pick = function (b) {
      return ((b && b.nodes) || []).map(function (n) { return typeof n === "string" ? n : n.url; });
    };
    jobs = [
      fetchJson(STATIC_NODES_URL, 6000).then(pick).catch(function () { return []; }),
      fetchJson(REGISTRY_NODES_URL, 6000).then(pick).catch(function () { return []; }),
    ];
  }
  return Promise.all(jobs).then(function (lists) {
    var seen = {}, urls = [];
    lists.forEach(function (l) { l.forEach(function (u) { if (u && !seen[u]) { seen[u] = 1; urls.push(u); } }); });
    if (!urls.length) return null;
    return new Promise(function (resolve) {
      var left = urls.length, settled = false;
      urls.forEach(function (u) {
        probeNode(u).then(function (ok) {
          if (!settled) { settled = true; resolve(ok); }
        }).catch(function () {
          left -= 1;
          if (left === 0 && !settled) resolve(null);
        });
      });
    });
  });
}

/* ---------- routing ---------- */
function parseRoute() {
  var h = location.hash.replace(/^#\/?/, "");
  var parts = h.split("/").filter(function (x) { return x !== ""; });
  if (!parts.length) return { name: "home" };
  if (parts[0] === "explore") return { name: "explore" };
  if (parts[0] === "bookmarks") return { name: "bookmarks" };
  if (parts[0] === "post" && parts[1]) return { name: "thread", id: decodeURIComponent(parts[1]) };
  if (parts[0] === "user" && parts[1]) return { name: "profile", username: decodeURIComponent(parts[1]) };
  return { name: "home" };
}
function routeKey(r) { return r.name + ":" + (r.id || r.username || ""); }
function applyRoute() {
  var r = parseRoute();
  var changed = routeKey(r) !== routeKey(state.route);
  state.route = r;
  state.navCount += 1;
  syncChrome();
  if (r.name === "home") {
    renderHome();
    if (state.node && !state.feed.items.length && !state.feed.loading && !state.feed.done) loadFeed(false);
  } else if (r.name === "explore") {
    renderExplore();
    loadNames();
  } else if (r.name === "bookmarks") {
    renderBookmarks();
  } else if (r.name === "thread") {
    if (changed || !state.thread || state.thread.id !== r.id) openThread(r.id);
    renderThread();
  } else if (r.name === "profile") {
    if (changed || !state.profile || state.profile.username !== r.username) openProfile(r.username);
    else renderProfile();
  }
  window.scrollTo(0, 0);
}
function syncChrome() {
  var r = state.route;
  var title = t().home;
  var back = false;
  if (r.name === "explore") title = t().explore;
  else if (r.name === "bookmarks") title = t().bookmarks;
  else if (r.name === "thread") { title = t().post; back = true; }
  else if (r.name === "profile") {
    title = state.profile && state.profile.user ? displayName(state.profile.user) : (r.username ? "@" + r.username : t().home);
    back = true;
  }
  document.getElementById("centerTitle").textContent = title;
  document.getElementById("backBtn").classList.toggle("show", back);
  document.querySelectorAll("[data-nav]").forEach(function (a) {
    a.classList.toggle("on", a.getAttribute("data-nav") === r.name);
  });
  renderNodeBox();
  renderSessionUI();
}

  var box = document.getElementById("nodeBox");

  var meta = document.getElementById("nodeMeta");
  var retry = document.getElementById("retryBtn");
  if (state.node) {

    host.textContent = state.node.replace(/^https?:\/\//, "");
    meta.textContent = t().nodeOn + " · " + t().network + " " + EXPECTED_NETWORK_ID;

  } else {

}

  var lk = e.target.closest("[data-like]");
  if (lk) { e.stopPropagation(); onLikeAct(lk); return; }
  var rc = e.target.closest("[data-recaw]");
  if (rc) { e.stopPropagation(); onRecawAct(rc); return; }
  var rp = e.target.closest("[data-reply]");
  if (rp) {
    e.stopPropagation();
    var rid = rp.getAttribute("data-reply");
    if (state.route.name === "thread" && threadEff && String(threadEff.id) === String(rid)) {
      var rt = document.getElementById("replyText");
      if (rt) rt.focus();
    } else {
      pendingReplyFocus = true;
      location.hash = "#/post/" + encodeURIComponent(rid);
    }
    return;
  }
  var bm = e.target.closest("[data-bookmark]");
  if (bm) {
    e.stopPropagation();
    var id = bm.getAttribute("data-bookmark");
    var nowOn = toggleBookmark(id);
    refreshBookmarkButtons(id);
    if (state.route.name === "bookmarks" && !nowOn) renderBookmarks();
    return;
  }
  if (e.target.closest("#feedMore")) { loadFeed(true); return; }
  if (e.target.closest("#threadMore")) { loadThread(state.thread.id, true); return; }
  if (e.target.closest("#profMore")) { loadProfileFeed(true); return; }
  var pt = e.target.closest("[data-proftab]");
  if (pt) {
    var p = state.profile;
    if (p && p.tab !== pt.getAttribute("data-proftab")) {
      p.tab = pt.getAttribute("data-proftab");
      renderProfile();
      if (!profFeed(p).loaded) loadProfileFeed(false);
    }
    return;
  }
  var usr = e.target.closest("[data-open-user]");
  if (usr && usr.getAttribute("data-open-user")) {
    location.hash = "#/user/" + encodeURIComponent(usr.getAttribute("data-open-user"));
    return;
  }
  var post = e.target.closest("[data-open-post]");
  if (post) {
    location.hash = "#/post/" + encodeURIComponent(post.getAttribute("data-open-post"));
  }
});
window.addEventListener("hashchange", applyRoute);

/* ---------- boot ---------- */
function boot() {
  state.node = null;
  state.discovered = false;
  state.feed = { items: [], cursor: null, done: false, loading: false, error: false };
  state.names = { items: null, loading: false, error: false };
  applyRoute();
  discover().then(function (node) {
    state.node = node;
    state.discovered = true;
    syncChrome();
    applyRoute();
    if (node) {
      if (!state.feed.items.length) loadFeed(false);
      loadNames();
      if (!sess && restoreSess(node)) {
        renderSessionUI();
        loadSessUser().then(function () { renderSessionUI(); refreshView(); });
        fetchValidatorTip().catch(function () {});
      }
    }
  });
}
hydrateIcons(document);
applyStaticTexts();
(function () {
  var userParam = null;
  try { userParam = new URLSearchParams(location.search).get("user"); } catch (e) {}
  if (userParam && !location.hash) location.hash = "#/user/" + encodeURIComponent(userParam);
})();
applyRoute();
boot();
// While no node is online, keep looking quietly — the first node to come
// up fills this page automatically.
setInterval(function () {
  if (!state.node && state.discovered) {
    discover().then(function (node) {
      if (node) {
        state.node = node;
        syncChrome();
        applyRoute();
        loadFeed(false);
        loadNames();
      }
    });
  }
}, 60000);
</script>
</body>
</html>
