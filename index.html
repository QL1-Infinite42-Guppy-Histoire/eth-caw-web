<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAW Web Viewer — Ethereum (community deployment, read-only)</title>
<meta name="description" content="Read-only web viewer for the community CAW deployment on Ethereum: timeline, names and profiles, read from public nodes.">
<link rel="icon" type="image/jpeg" href="assets/logo.jpg">
<script>
  if (localStorage.getItem("guppy-theme") === "dark") document.documentElement.dataset.theme = "dark";
</script>
<style>
  :root, :root[data-theme="light"] {
    --bg: #ffffff; --text: #0f1419; --muted: #536471; --accent: #1d9bf0; --accent-hover: #1a8cd8;
    --border: #eff3f4; --border-strong: #cfd9de; --hover: rgba(15,20,25,.03); --active-bg: rgba(15,20,25,.06);
    --card-bg: #f7f9f9; --search-bg: #eff3f4; --like: #f91880; --recaw: #00ba7c;
    --bg-blur: rgba(255,255,255,.85); --banner: linear-gradient(120deg, #1d9bf0, #794bc4);
  }
  :root[data-theme="dark"] {
    --bg: #000000; --text: #e7e9ea; --muted: #71767b; --accent: #1d9bf0; --accent-hover: #1a8cd8;
    --border: #2f3336; --border-strong: #536471; --hover: rgba(231,233,234,.03); --active-bg: rgba(231,233,234,.08);
    --card-bg: #16181c; --search-bg: #202327; --like: #f91880; --recaw: #00ba7c;
    --bg-blur: rgba(0,0,0,.65); --banner: linear-gradient(120deg, #0d4d73, #3d2a63);
  }
  * { box-sizing: border-box; }
  html { scrollbar-gutter: stable; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", Helvetica, Arial, sans-serif; line-height: 1.45; font-size: 15px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  .hidden { display: none !important; }

  .shell { display: grid; grid-template-columns: 275px minmax(0,600px) 350px; column-gap: 20px; max-width: 1265px; margin: 0 auto; }

  /* ---------- left sidebar ---------- */
  .sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 6px 12px 16px; overflow-y: auto; }
  .logo-row { display: flex; align-items: center; gap: 12px; padding: 8px 10px; }
  .logo-img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; display: block; }
  .logo-word { font-size: 21px; font-weight: 800; letter-spacing: .01em; }
  .logo-word small { display: block; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
  .snav { margin-top: 6px; display: flex; flex-direction: column; gap: 2px; }
  .snav a { display: flex; align-items: center; gap: 18px; padding: 11px 12px; border-radius: 999px; color: var(--text); font-size: 19px; width: fit-content; max-width: 100%; }
  .snav a:hover { background: var(--hover); text-decoration: none; }
  .snav a.on { font-weight: 800; }
  .snav svg { width: 26px; height: 26px; flex: none; }
  .snav .lbl { padding-right: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .getapp { margin-top: 18px; display: block; text-align: center; background: var(--accent); color: #fff; font-weight: 700; font-size: 16px; border-radius: 999px; padding: 13px 20px; width: 88%; }
  .getapp:hover { background: var(--accent-hover); text-decoration: none; }
  .side-bottom { margin-top: auto; padding: 14px 10px 0; }
  .nodebox { display: flex; gap: 9px; align-items: flex-start; font-size: 13px; color: var(--muted); }
  .nodebox .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; margin-top: 5px; }
  .nodebox.on .dot { background: var(--recaw); }
  .nodebox .host { font-weight: 700; color: var(--text); word-break: break-all; }
  .nodebox .retry { color: var(--accent); font-weight: 700; padding: 0; font-size: 13px; }
  .side-controls { display: flex; gap: 6px; margin-top: 12px; }
  .side-controls button { font-size: 13px; font-weight: 700; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 6px 13px; }
  .side-controls button:hover { background: var(--hover); color: var(--text); }

  /* ---------- center column ---------- */
  .center { border-left: 1px solid var(--border); border-right: 1px solid var(--border); min-height: 100vh; min-width: 0; }
  .center-header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 0 16px; height: 54px; background: var(--bg-blur); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .center-header .ttl { font-size: 19px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .backbtn { display: none; width: 34px; height: 34px; border-radius: 50%; align-items: center; justify-content: center; flex: none; margin-left: -8px; }
  .backbtn:hover { background: var(--hover); }
  .backbtn.show { display: flex; }
  .backbtn svg { width: 20px; height: 20px; }

  .ro-card { margin: 12px 16px; border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px; font-size: 14px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .ro-badge { background: var(--accent); color: #fff; border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 800; flex: none; }
  .ro-card a { font-weight: 700; }

  .state-box { padding: 48px 32px; text-align: left; }
  .state-box h2 { font-size: 29px; font-weight: 800; margin: 0 0 10px; line-height: 1.25; }
  .state-box p { color: var(--muted); margin: 0 0 12px; font-size: 15px; }
  .state-box.center { text-align: center; border: none; min-height: 0; }
  .err { color: #f4212e; }

  /* ---------- post cells ---------- */
  .post { padding: 12px 16px 4px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .post:hover { background: var(--hover); }
  .ctx-line { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 700; margin: 0 0 4px 26px; }
  .ctx-line svg { width: 15px; height: 15px; }
  .reply-line { color: var(--muted); font-size: 14px; margin-bottom: 2px; }
  .reply-line .mention { color: var(--accent); }
  .post-row { display: flex; gap: 10px; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; color: #fff; overflow: hidden; cursor: pointer; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .post-main { flex: 1; min-width: 0; }
  .post-head { display: flex; align-items: baseline; gap: 5px; min-width: 0; }
  .pname { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .pname:hover { text-decoration: underline; }
  .phandle { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .post-body { white-space: pre-wrap; word-break: break-word; font-size: 15px; margin-top: 1px; }
  .post-body a, .mention { color: var(--accent); }
  .mention { cursor: pointer; }
  .mention:hover { text-decoration: underline; }
  .quote-embed { border: 1px solid var(--border-strong); border-radius: 16px; padding: 10px 12px; margin-top: 10px; cursor: pointer; }
  .quote-embed:hover { background: var(--hover); }
  .quote-embed .post-body { font-size: 14px; }
  .quote-embed .avatar { width: 20px; height: 20px; font-size: 10px; }
  .quote-head { display: flex; align-items: center; gap: 5px; }
  .actions { display: flex; align-items: center; justify-content: space-between; max-width: 425px; margin: 6px 0 4px -8px; color: var(--muted); }
  .act { display: inline-flex; align-items: center; gap: 3px; font-size: 13px; padding: 6px 8px; border-radius: 999px; line-height: 1; }
  .act svg { width: 18px; height: 18px; }
  .act i { font-style: normal; min-width: 8px; }
  button.act:hover { background: var(--hover); }
  .act.like.on { color: var(--like); }
  .act.recaw.on { color: var(--recaw); }
  button.act.bm { color: var(--muted); }
  button.act.bm.on { color: var(--accent); }
  .showmore { display: block; width: 100%; text-align: center; color: var(--accent); font-size: 15px; padding: 16px; border-bottom: 1px solid var(--border); }
  .showmore:hover { background: var(--hover); }
  .showmore:disabled { color: var(--muted); cursor: default; background: none; }

  /* ---------- thread ---------- */
  .thread-post { padding: 14px 16px 6px; border-bottom: 1px solid var(--border); }
  .thread-post .avatar { width: 44px; height: 44px; }
  .thead-names { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .thead-names .pname { font-size: 15px; }
  .thead-names .phandle { flex: none; }
  .thread-body { font-size: 17px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; margin-top: 12px; }
  .thread-meta { color: var(--muted); font-size: 15px; margin-top: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .thread-meta b { color: var(--text); }
  .thread-post .actions { margin-top: 4px; }

  /* ---------- profile ---------- */
  .banner { height: 200px; background: var(--banner); }
  .prof-pad { padding: 0 16px; }
  .prof-avatar { width: 128px; height: 128px; border-radius: 50%; border: 4px solid var(--bg); margin-top: -64px; font-size: 46px; display: flex; align-items: center; justify-content: center; color: #fff; overflow: hidden; background: var(--card-bg); position: relative; z-index: 1; }
  .prof-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .prof-name { font-size: 20px; font-weight: 800; margin-top: 8px; }
  .prof-handle { color: var(--muted); font-size: 15px; }
  .deposit-card { display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; margin-top: 14px; }
  .deposit-card img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; }
  .deposit-card .dk { color: var(--muted); font-size: 13px; }
  .deposit-card .dv { font-size: 19px; font-weight: 800; }
  .prof-stats { display: flex; gap: 20px; margin-top: 14px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
  .prof-stats b { color: var(--text); font-size: 15px; }
  .prof-tabs { display: flex; margin-top: 14px; border-bottom: 1px solid var(--border); }
  .prof-tabs button { flex: 1; padding: 15px 4px; font-size: 15px; font-weight: 500; color: var(--muted); position: relative; }
  .prof-tabs button:hover { background: var(--hover); }
  .prof-tabs button.on { font-weight: 800; color: var(--text); }
  .prof-tabs button.on::after { content: ""; position: absolute; left: 50%; transform: translateX(-50%); bottom: 0; width: 56px; height: 4px; border-radius: 999px; background: var(--accent); }

  /* ---------- explore / names ---------- */
  .explore-search { padding: 12px 16px 4px; }
  .searchbox { display: flex; align-items: center; gap: 10px; background: var(--search-bg); border: 1px solid transparent; border-radius: 999px; padding: 11px 16px; }
  .searchbox:focus-within { background: var(--bg); border-color: var(--accent); }
  .searchbox svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
  .searchbox input { flex: 1; border: none; background: none; color: var(--text); font: inherit; font-size: 15px; outline: none; min-width: 0; }
  .sec-title { font-size: 19px; font-weight: 800; padding: 14px 16px 6px; }
  .namerow { display: flex; align-items: center; gap: 10px; padding: 12px 16px; cursor: pointer; }
  .namerow:hover { background: var(--hover); }
  .namerow .nm { min-width: 0; flex: 1; }
  .namerow .nm .pname { display: block; }
  .namerow .sub { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .viewbtn { flex: none; background: var(--text); color: var(--bg); font-weight: 700; font-size: 14px; border-radius: 999px; padding: 7px 16px; }
  .bm-note { padding: 12px 16px; color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--border); }

  /* ---------- right rail ---------- */
  .rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 6px 0 24px; scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .rail .searchbox { margin-bottom: 14px; }
  .rail-card { background: var(--card-bg); border-radius: 16px; padding: 14px 0 8px; margin-bottom: 16px; overflow: hidden; }
  .rail-card h2 { font-size: 19px; font-weight: 800; margin: 0; padding: 0 16px 8px; }
  .rail-card .namerow { padding: 10px 16px; }
  .rail-card .namerow:hover { background: var(--hover); }
  .rail .showmore { border-bottom: none; text-align: left; padding: 12px 16px; }
  .about-logo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
  .about-body { padding: 0 16px; font-size: 14px; color: var(--muted); }
  .about-body p { margin: 8px 0; }
  .about-links { padding: 2px 16px 10px; font-size: 14px; font-weight: 700; display: flex; flex-direction: column; gap: 6px; }
  .rail-foot { color: var(--muted); font-size: 13px; padding: 0 16px; line-height: 1.9; }
  .rail-foot a { color: var(--muted); }
  .rail-foot a:hover { text-decoration: underline; }

  /* ---------- mobile bottom bar ---------- */
  .mobilebar { display: none; }
  @media (max-width: 1279px) {
    .shell { grid-template-columns: 72px minmax(0,600px) 320px; column-gap: 12px; max-width: 1030px; }
    .sidebar { padding: 6px 6px 16px; align-items: center; }
    .snav a { padding: 12px; gap: 0; }
    .snav .lbl, .logo-word, .getapp, .nodebox .txt, .side-controls { display: none; }
    .side-bottom { padding: 14px 0 0; }
    .nodebox { justify-content: center; }
  }
  @media (max-width: 1023px) {
    .shell { grid-template-columns: 72px minmax(0,600px); max-width: 690px; }
    .rail { display: none; }
  }
  @media (max-width: 699px) {
    .shell { grid-template-columns: minmax(0,1fr); max-width: none; }
    .sidebar { display: none; }
    .center { border-left: none; border-right: none; }
    .banner { height: 130px; }
    .prof-avatar { width: 84px; height: 84px; margin-top: -42px; font-size: 30px; border-width: 3px; }
    body { padding-bottom: 52px; }
    .mobilebar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--bg-blur); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--border); height: 52px; }
    .mobilebar a { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text); }
    .mobilebar a svg { width: 25px; height: 25px; }
    .mobilebar a.on svg { stroke-width: 2.6; }
  }
</style>
</head>

<div class="shell">
  <header class="sidebar">
    <div class="logo-row">
      <img class="logo-img" src="assets/logo.jpg" alt="CAW">
      <div class="logo-word">CAW<small id="brandSub"></small></div>
    </div>
    <nav class="snav" id="sideNav">
      <a href="#/" data-nav="home"><span data-icon="home"></span><span class="lbl" id="navHome"></span></a>
      <a href="#/explore" data-nav="explore"><span data-icon="search"></span><span class="lbl" id="navExplore"></span></a>
      <a href="#/bookmarks" data-nav="bookmarks"><span data-icon="bookmark"></span><span class="lbl" id="navBookmarks"></span></a>

      <div class="side-controls">
        <button id="langToggle" type="button">日本語</button>
        <button id="themeToggle" type="button"></button>
      </div>

  </header>

  <main class="center">
    <div class="center-header">
      <button class="backbtn" id="backBtn" type="button" aria-label="Back"><span data-icon="back"></span></button>
      <span class="ttl" id="centerTitle"></span>
    </div>
    <div id="view"></div>
  </main>

  <aside class="rail">
    <form class="searchbox" id="railSearch" autocomplete="off">
      <span data-icon="search"></span>
      <input id="railSearchInput" type="search">

    <section class="rail-card" id="railNamesCard">
      <h2 id="railNamesTitle"></h2>
      <div id="railNames"></div>
      <button class="showmore" id="railNamesMore" type="button"></button>

    <section class="rail-card">
      <h2 id="aboutTitle"></h2>
      <div class="about-body">
        <img class="about-logo" src="assets/logo.jpg" alt="">
        <p id="aboutBody"></p>
      </div>
      <div class="about-links">
        <a href="https://ql1-infinite42-guppy-histoire.github.io/eth-caw/" target="_blank" rel="noopener" id="aboutLink"></a>
        <a href="https://ql1-infinite42-guppy-histoire.github.io/eth-caw-transparency/" target="_blank" rel="noopener" id="transparencyLink"></a>
      </div>
    </section>
    <nav class="rail-foot">
      <a href="https://ql1-infinite42-guppy-histoire.github.io/eth-caw/" target="_blank" rel="noopener" id="footAbout"></a> ·
      <a href="https://ql1-infinite42-guppy-histoire.github.io/eth-caw-names/" target="_blank" rel="noopener" id="footNames"></a> ·
      <a href="https://ql1-infinite42-guppy-histoire.github.io/eth-caw-transparency/" target="_blank" rel="noopener" id="footTransparency"></a> ·
      <a href="https://github.com/QL1-Infinite42-Guppy-Histoire/eth-caw-web" target="_blank" rel="noopener">GitHub</a>
      <div id="footNote"></div>
    </nav>
  </aside>
</div>

<nav class="mobilebar" id="mobileBar">
  <a href="#/" data-nav="home"><span data-icon="home"></span></a>
  <a href="#/explore" data-nav="explore"><span data-icon="search"></span></a>
  <a href="#/bookmarks" data-nav="bookmarks"><span data-icon="bookmark"></span></a>
</nav>

var lang = "en";
try { lang = localStorage.getItem("ethcaw-web-lang") === "jp" ? "jp" : "en"; } catch (e) {}
function t() { return STRINGS[lang]; }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function fetchJson(url, timeoutMs) {
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, timeoutMs || 8000);
  return fetch(url, { signal: ctrl.signal }).then(function (res) {
    clearTimeout(timer);
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }).catch(function (e) { clearTimeout(timer); throw e; });
}

/* ---- icons: inline SVG, stroke style, currentColor ---- */
var ICON_PATHS = {

  heart: '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>',
  views: '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
};
function icon(name, filled) {
  return '<svg viewBox="0 0 24 24" fill="' + (filled ? "currentColor" : "none") + '" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON_PATHS[name] + "</svg>";
}
function hydrateIcons(root) {
  (root || document).querySelectorAll("[data-icon]").forEach(function (el) {
    el.innerHTML = icon(el.getAttribute("data-icon"));

/* ---- formatting ---- */
function fmtRel(iso) {
  var d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  var sec = Math.floor((Date.now() - d.getTime()) / 1000);
  if (sec < 45) return lang === "jp" ? "今" : "now";
  var min = Math.floor(sec / 60);
  if (min < 60) return lang === "jp" ? min + "分" : min + "m";
  var hr = Math.floor(min / 60);
  if (hr < 24) return lang === "jp" ? hr + "時間" : hr + "h";
  var day = Math.floor(hr / 24);
  if (day < 7) return lang === "jp" ? day + "日" : day + "d";
  var opts = { month: "short", day: "numeric" };
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
  return d.toLocaleDateString(lang === "jp" ? "ja-JP" : "en-US", opts);
}
var MONTHS_EN = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function fmtCount(n) {
  n = Number(n) || 0;
  if (n < 1000) return String(n);
  if (n < 1000000) { var k = n / 1000; return (k >= 100 ? Math.round(k) : Math.round(k * 10) / 10) + "K"; }
  var m = n / 1000000;
  return (m >= 100 ? Math.round(m) : Math.round(m * 10) / 10) + "M";
}
function fmtThreadMeta(item) {
  var d = new Date(item.timestamp);
  if (isNaN(d.getTime())) return "";
  var viewsPart = "";
  if (typeof item.viewCount === "number") {
    if (lang === "jp") viewsPart = " · " + item.viewCount.toLocaleString("en-US") + " " + t().views;
    else viewsPart = " · " + item.viewCount.toLocaleString("en-US") + " " + t().views;
  }
  if (lang === "jp") {
    var h = d.getHours();
    var ampm = h < 12 ? "午前" : "午後";
    var h12 = h % 12 === 0 ? 12 : h % 12;
    var mm = String(d.getMinutes()).padStart(2, "0");
    return ampm + h12 + ":" + mm + " · " + d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日" + viewsPart;
  }
  var hh = d.getHours();
  var ap = hh < 12 ? "AM" : "PM";
  var hh12 = hh % 12 === 0 ? 12 : hh % 12;
  var min2 = String(d.getMinutes()).padStart(2, "0");
  return hh12 + ":" + min2 + " " + ap + " · " + MONTHS_EN[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear() + viewsPart;
}
function fmtCaw(weiStr) {
  if (weiStr == null || weiStr === "") return null;
  try {
    var w = BigInt(weiStr);
    var whole = w / 1000000000000000000n;
    var frac = w % 1000000000000000000n;
    if (frac === 0n) return whole.toLocaleString("en-US") + " CAW";
    var f = Number(w) / 1e18;
    return f.toLocaleString("en-US", { maximumFractionDigits: 2 }) + " CAW";
  } catch (e) { return null; }
}
var AVATAR_COLORS = ["#1d9bf0", "#7856ff", "#f91880", "#00ba7c", "#ff7a00", "#e0245e", "#0f7ae5", "#17bf63"];
function avatarColor(seed) {
  var s = String(seed || "?"), h = 0;
  for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function avatarHtml(user, cls) {
  user = user || {};
  var url = null;
  if (user.avatarUrl && /^https?:\/\//.test(user.avatarUrl)) url = user.avatarUrl;
  else if (user.image && /^https?:\/\//.test(user.image)) url = user.image;
  else if (user.image && user.image.indexOf("<svg") === 0) url = "data:image/svg+xml;utf8," + encodeURIComponent(user.image);
  var uname = user.username || "";
  var click = uname ? ' data-open-user="' + esc(uname) + '"' : "";
  if (url) return '<div class="avatar ' + (cls || "") + '"' + click + '><img alt="" src="' + esc(url) + '"></div>';
  var ch = (user.username || user.displayName || "?").charAt(0).toUpperCase();
  return '<div class="avatar ' + (cls || "") + '" style="background:' + avatarColor(user.username || user.tokenId) + '"' + click + ">" + esc(ch) + "</div>";
}
function displayName(user) {
  user = user || {};
  return user.displayName || user.username || ("#" + (user.tokenId || "?"));
}
function linkify(text) {
  var out = esc(text);
  out = out.replace(/https?:\/\/[^\s<]+/g, function (u) {
    return '<a href="' + u + '" target="_blank" rel="noopener nofollow">' + u + "</a>";
  });
  out = out.replace(/(^|\s)@([a-z0-9_]{2,32})/gi, function (m, pre, name) {
    return pre + '<span class="mention" data-open-user="' + name + '">@' + name + "</span>";
  });
  return out;
}

/* ---- bookmarks: localStorage only, snapshots of the post payload ---- */
var BM_KEY = "ethcaw-web-bookmarks";
var postCache = {}; // effective post id -> shaped caw item (as rendered)
function loadBookmarks() {
  try {
    var arr = JSON.parse(localStorage.getItem(BM_KEY) || "[]");
    return Array.isArray(arr) ? arr.filter(function (b) { return b && b.id && b.item; }) : [];
  } catch (e) { return []; }
}
function saveBookmarks(list) {
  try { localStorage.setItem(BM_KEY, JSON.stringify(list)); } catch (e) {}
}
function isBookmarked(id) {
  return loadBookmarks().some(function (b) { return String(b.id) === String(id); });
}
function toggleBookmark(id) {
  var list = loadBookmarks();
  var idx = -1;
  for (var i = 0; i < list.length; i++) if (String(list[i].id) === String(id)) { idx = i; break; }
  if (idx >= 0) list.splice(idx, 1);
  else if (postCache[id]) list.unshift({ id: String(id), item: postCache[id], savedAt: Date.now() });
  saveBookmarks(list);
  return idx < 0;
}
function refreshBookmarkButtons(id) {
  var on = isBookmarked(id);
  document.querySelectorAll('[data-bookmark="' + CSS.escape(String(id)) + '"]').forEach(function (btn) {
    btn.classList.toggle("on", on);
    btn.innerHTML = icon("bookmark", on) ;
  });
}
</script>

<script>
"use strict";
var state = {
  node: null,
  discovered: false,
  route: { name: "home" },
  feed: { items: [], cursor: null, done: false, loading: false, error: false },
  names: { items: null, loading: false, error: false },
  search: { q: "", items: null, loading: false },
  thread: null,
  profile: null,
  navCount: 0,
};

/* ---------- node discovery (unchanged behavior) ---------- */
function probeNode(url) {
  var base = url.replace(/\/+$/, "");
  return fetchJson(base + "/api/instances", 5000).then(function (info) {
    if (info && typeof info.networkId === "number" && info.networkId === EXPECTED_NETWORK_ID) return base;
    throw new Error("unexpected networkId");
  });
}
function discover() {
  var forced = null;
  try { forced = new URLSearchParams(location.search).get("node"); } catch (e) {}
  var jobs;
  if (forced) {
    jobs = [Promise.resolve([forced])];
  } else {
    var pick = function (b) {
      return ((b && b.nodes) || []).map(function (n) { return typeof n === "string" ? n : n.url; });
    };
    jobs = [
      fetchJson(STATIC_NODES_URL, 6000).then(pick).catch(function () { return []; }),
      fetchJson(REGISTRY_NODES_URL, 6000).then(pick).catch(function () { return []; }),
    ];
  }
  return Promise.all(jobs).then(function (lists) {
    var seen = {}, urls = [];
    lists.forEach(function (l) { l.forEach(function (u) { if (u && !seen[u]) { seen[u] = 1; urls.push(u); } }); });
    if (!urls.length) return null;
    return new Promise(function (resolve) {
      var left = urls.length, settled = false;
      urls.forEach(function (u) {
        probeNode(u).then(function (ok) {
          if (!settled) { settled = true; resolve(ok); }
        }).catch(function () {
          left -= 1;
          if (left === 0 && !settled) resolve(null);
        });
      });
    });
  });
}
function api(path) { return fetchJson(state.node + path, 12000); }

/* ---------- post rendering ---------- */
function isPlainRecaw(item) {
  return item && item.action === "RECAW" && !item.content && !!item.parent;
}
function effective(item) {
  return isPlainRecaw(item) ? item.parent : item;
}
function actionsHtml(eff) {
  var id = eff.id;
  var bmOn = isBookmarked(id);
  var h = '<div class="actions">';
  h += '<span class="act reply">' + icon("reply") + "<i>" + (eff.commentCount ? fmtCount(eff.commentCount) : "") + "</i></span>";
  h += '<span class="act recaw' + (eff.hasRecawed ? " on" : "") + '">' + icon("recaw") + "<i>" + (eff.recawCount ? fmtCount(eff.recawCount) : "") + "</i></span>";
  h += '<span class="act like' + (eff.hasLiked ? " on" : "") + '">' + icon("heart", !!eff.hasLiked) + "<i>" + (eff.likeCount ? fmtCount(eff.likeCount) : "") + "</i></span>";
  if (typeof eff.viewCount === "number") {
    h += '<span class="act views">' + icon("views") + "<i>" + fmtCount(eff.viewCount) + "</i></span>";
  } else {
    h += '<span class="act"></span>';
  }
  h += '<button type="button" class="act bm' + (bmOn ? " on" : "") + '" data-bookmark="' + esc(id) + '" aria-label="' + esc(t().bookmarkLabel) + '">' + icon("bookmark", bmOn) + "</button>";
  h += "</div>";
  return h;
}
function quoteHtml(parent) {
  var u = parent.user || {};
  return '<div class="quote-embed" data-open-post="' + esc(parent.id) + '">' +
    '<div class="quote-head">' + avatarHtml(u) +
    '<span class="pname" data-open-user="' + esc(u.username || "") + '">' + esc(displayName(u)) + "</span>" +
    '<span class="phandle">@' + esc(u.username || "") + " · " + esc(fmtRel(parent.timestamp)) + "</span></div>" +
    '<div class="post-body">' + linkify(parent.content || "") + "</div></div>";
}
function postHtml(item) {
  var eff = effective(item);
  if (!eff || eff.id == null) return "";
  postCache[eff.id] = eff;
  if (item !== eff) postCache[item.id] = item;
  var u = eff.user || {};
  var h = '<article class="post" data-open-post="' + esc(eff.id) + '">';
  if (isPlainRecaw(item)) {
    var ru = item.user || {};
    h += '<div class="ctx-line">' + icon("recaw") + "<span>" + esc(displayName(ru)) + " " + esc(t().recawed) + "</span></div>";
  }
  h += '<div class="post-row">' + avatarHtml(u) + '<div class="post-main">';
  h += '<div class="post-head"><span class="pname" data-open-user="' + esc(u.username || "") + '">' + esc(displayName(u)) + "</span>" +
    '<span class="phandle">@' + esc(u.username || "") + " · " + esc(fmtRel(eff.timestamp)) + "</span></div>";
  if (eff.parent && eff.action === "CAW" && eff.parent.user) {
    h += '<div class="reply-line">' + esc(t().replyingTo) + ' <span class="mention" data-open-user="' + esc(eff.parent.user.username || "") + '">@' + esc(eff.parent.user.username || "") + "</span></div>";
  }
  h += '<div class="post-body">' + linkify(eff.content || "") + "</div>";
  if (eff.isQuote && eff.parent) h += quoteHtml(eff.parent);
  h += actionsHtml(eff);
  h += "</div></div></article>";
  return h;
}
function nameRowHtml(u, showViewBtn) {
  var right = showViewBtn
    ? '<button type="button" class="viewbtn" data-open-user="' + esc(u.username || "") + '">' + esc(t().viewBtn) + "</button>"
    : '<span class="sub">' + (u.followerCount || 0) + " " + esc(t().followers) + "</span>";
  return '<div class="namerow" data-open-user="' + esc(u.username || "") + '">' + avatarHtml(u) +
    '<div class="nm"><span class="pname">' + esc(displayName(u)) + "</span>" +
    '<span class="sub">@' + esc(u.username || "") + " · #" + esc(u.tokenId) + "</span></div>" + right + "</div>";
}

/* ---------- shared states ---------- */
function noNodeHtml() {
  return '<div class="state-box"><h2>' + esc(t().noNodeTitle) + "</h2><p>" + esc(t().noNodeBody) + "</p>" +
    '<p><a href="' + INTRO_URL + '#run-a-node" target="_blank" rel="noopener">' + esc(t().runNode) + "</a></p></div>";
}
function loadingHtml() { return '<div class="state-box center"><p>' + esc(t().loading) + "</p></div>"; }
function roCardHtml() {
  return '<div class="ro-card"><span class="ro-badge">' + esc(t().readOnly) + "</span><span>" + esc(t().roNote) + '</span> <a href="' + INTRO_URL + '" target="_blank" rel="noopener">' + esc(t().getApp) + "</a></div>";
}
function gateHtml() {
  if (!state.discovered) return loadingHtml();
  if (!state.node) return noNodeHtml();
  return null;
}

/* ---------- home ---------- */
function renderHome() {
  var el = document.getElementById("view");
  var gate = gateHtml();
  if (gate) { el.innerHTML = gate; return; }
  var f = state.feed;
  var html = roCardHtml();
  if (f.error && !f.items.length) html += '<div class="state-box center"><p class="err">' + esc(t().feedErr) + "</p></div>";
  else if (!f.items.length && !f.loading) html += '<div class="state-box center"><p>' + esc(t().noPosts) + "</p></div>";
  else html += f.items.map(postHtml).join("");
  if (f.items.length && !f.done) {
    html += '<button class="showmore" id="feedMore" type="button"' + (f.loading ? " disabled" : "") + ">" + esc(f.loading ? t().loading : t().loadMore) + "</button>";
  }
  el.innerHTML = html;
}
function loadFeed(more) {
  if (!state.node || state.feed.loading) return;
  state.feed.loading = true;
  if (state.route.name === "home") renderHome();
  var q = "/api/caws?limit=30" + (more && state.feed.cursor ? "&cursor=" + encodeURIComponent(state.feed.cursor) : "");
  api(q).then(function (b) {
    var items = (b && b.items) || [];
    state.feed.items = more ? state.feed.items.concat(items) : items;
    state.feed.cursor = (b && b.nextCursor) || null;
    state.feed.done = !(b && b.nextCursor);
    state.feed.error = false;
  }).catch(function () { state.feed.error = true; })
    .finally(function () { state.feed.loading = false; if (state.route.name === "home") renderHome(); });
}

/* ---------- explore ---------- */
function renderExplore() {
  var el = document.getElementById("view");
  var gate = gateHtml();
  if (gate) { el.innerHTML = gate; return; }
  var prevInput = document.getElementById("exploreSearchInput");
  var hadFocus = !!prevInput && document.activeElement === prevInput;
  var caret = prevInput ? prevInput.selectionStart : null;
  var s = state.search;
  var html = '<div class="explore-search"><form class="searchbox" id="exploreSearch" autocomplete="off">' +
    icon("search") + '<input id="exploreSearchInput" type="search" placeholder="' + esc(t().searchPh) + '" value="' + esc(s.q) + '"></form></div>';
  if (s.q) {
    html += '<div class="sec-title">' + esc(t().explore) + "</div>";
    if (s.loading || s.items === null) html += loadingHtml();
    else if (!s.items.length) html += '<div class="state-box center"><p>' + esc(t().noResults) + "</p></div>";
    else html += s.items.map(function (u) { return nameRowHtml(u, true); }).join("");
  }
  html += '<div class="sec-title">' + esc(t().namesToExplore) + "</div>";
  if (state.names.loading || state.names.items === null) html += loadingHtml();
  else if (state.names.error) html += '<div class="state-box center"><p class="err">' + esc(t().feedErr) + "</p></div>";
  else if (!state.names.items.length) html += '<div class="state-box center"><p>' + esc(t().noResults) + "</p></div>";
  else html += state.names.items.map(function (u) { return nameRowHtml(u, true); }).join("");
  el.innerHTML = html;
  var input = document.getElementById("exploreSearchInput");
  if (input) {
    input.addEventListener("input", onSearchInput);
    if (hadFocus) {
      input.focus();
      try { input.setSelectionRange(caret, caret); } catch (e) {}
    }
  }
  var form = document.getElementById("exploreSearch");
  if (form) form.addEventListener("submit", function (e) { e.preventDefault(); });
}
var searchTimer = null;
function onSearchInput(e) {
  var q = e.target.value.trim();
  state.search.q = q;
  if (searchTimer) clearTimeout(searchTimer);
  if (!q) { state.search.items = null; if (state.route.name === "explore") renderExplore(); return; }
  searchTimer = setTimeout(function () {
    state.search.loading = true;
    api("/api/users/search/" + encodeURIComponent(q) + "?limit=15").then(function (b) {
      state.search.items = (b && (b.users || b)) || [];
    }).catch(function () { state.search.items = []; })
      .finally(function () { state.search.loading = false; if (state.route.name === "explore") renderExplore(); });
  }, 350);
}
function loadNames() {
  if (!state.node || state.names.loading || state.names.items !== null) return;
  state.names.loading = true;
  api("/api/users/top-followed?limit=20").then(function (b) {
    state.names.items = Array.isArray(b) ? b : ((b && b.users) || []);
    state.names.error = false;
  }).catch(function () { state.names.error = true; state.names.items = []; })
    .finally(function () {
      state.names.loading = false;
      renderRailNames();
      if (state.route.name === "explore") renderExplore();
    });
}
function renderRailNames() {
  var box = document.getElementById("railNames");
  if (!box) return;
  if (!state.node || !state.names.items || !state.names.items.length) {
    document.getElementById("railNamesCard").classList.add("hidden");
    return;
  }
  document.getElementById("railNamesCard").classList.remove("hidden");
  box.innerHTML = state.names.items.slice(0, 6).map(function (u) { return nameRowHtml(u, true); }).join("");
}

/* ---------- bookmarks ---------- */
function renderBookmarks() {
  var el = document.getElementById("view");
  var list = loadBookmarks();
  var html = '<div class="bm-note">' + esc(t().bookmarksNote) + "</div>";
  if (!list.length) html += '<div class="state-box center"><p>' + esc(t().bookmarksEmpty) + "</p></div>";
  else html += list.map(function (b) { return postHtml(b.item); }).join("");
  el.innerHTML = html;
}

/* ---------- thread ---------- */
function renderThread() {
  var el = document.getElementById("view");
  var gate = gateHtml();
  if (gate) { el.innerHTML = gate; return; }
  var th = state.thread;
  if (!th || th.loading && !th.caw) { el.innerHTML = loadingHtml(); return; }
  if (th.error || !th.caw) { el.innerHTML = '<div class="state-box center"><p class="err">' + esc(t().threadErr) + "</p></div>"; return; }
  var caw = th.caw;
  var u = caw.user || {};
  postCache[caw.id] = caw;
  var h = '<div class="thread-post">';
  if (isPlainRecaw(caw)) {
    var ru = caw.user || {};
    h += '<div class="ctx-line">' + icon("recaw") + "<span>" + esc(displayName(ru)) + " " + esc(t().recawed) + "</span></div>";
    caw = caw.parent; u = caw.user || {}; postCache[caw.id] = caw;
  }
  h += '<div class="post-row">' + avatarHtml(u) + '<div class="thead-names">' +
    '<span class="pname" data-open-user="' + esc(u.username || "") + '">' + esc(displayName(u)) + "</span>" +
    '<span class="phandle">@' + esc(u.username || "") + "</span></div></div>";
  h += '<div class="thread-body">' + linkify(caw.content || "") + "</div>";
  if (caw.isQuote && caw.parent) h += quoteHtml(caw.parent);
  h += '<div class="thread-meta">' + esc(fmtThreadMeta(caw)) + "</div>";
  h += actionsHtml(caw);
  h += "</div>";
  if (!th.comments.length && !th.loading) h += '<div class="state-box center"><p>' + esc(t().noReplies) + "</p></div>";
  else h += th.comments.map(postHtml).join("");
  if (th.comments.length && th.hasMore) {
    h += '<button class="showmore" id="threadMore" type="button"' + (th.loading ? " disabled" : "") + ">" + esc(th.loading ? t().loading : t().loadMore) + "</button>";
  }
  el.innerHTML = h;
}
function loadThread(id, more) {
  var th = state.thread;
  if (!th || th.loading) return;
  th.loading = true;
  var q = "/api/caws/" + encodeURIComponent(id) + (more && th.nextCursor ? "?commentCursor=" + encodeURIComponent(th.nextCursor) : "");
  api(q).then(function (b) {
    if (!more) th.caw = (b && b.caw) || null;
    var comments = (b && b.comments) || [];
    th.comments = more ? th.comments.concat(comments) : comments;
    th.nextCursor = (b && b.nextCommentCursor) || null;
    th.hasMore = !!(b && b.hasMoreComments);
    if (!th.caw) th.error = true;
  }).catch(function () { th.error = true; })
    .finally(function () { th.loading = false; if (state.route.name === "thread") renderThread(); });
}
function openThread(id) {
  state.thread = { id: String(id), caw: null, comments: [], nextCursor: null, hasMore: false, loading: false, error: false };
  loadThread(id, false);
}

/* ---------- profile ---------- */
var PROF_TABS = ["posts", "replies", "likes"];
function profFeed(p) { return p.feeds[p.tab]; }
function renderProfile() {
  var el = document.getElementById("view");
  var gate = gateHtml();
  if (gate) { el.innerHTML = gate; return; }
  var p = state.profile;
  if (!p) { el.innerHTML = loadingHtml(); return; }
  if (p.loading && !p.user) { el.innerHTML = loadingHtml(); return; }
  if (p.error || !p.user) { el.innerHTML = '<div class="state-box center"><p class="err">' + esc(t().profileErr) + "</p></div>"; return; }
  var u = p.user;
  var dep = fmtCaw(u.onChainStakeWei);
  var addr = u.address ? u.address.slice(0, 6) + "…" + u.address.slice(-4) : "";
  var h = '<div class="banner"></div><div class="prof-pad">';
  h += avatarHtml(u, "prof-avatar");
  h += '<div class="prof-name">' + esc(displayName(u)) + '</div><div class="prof-handle">@' + esc(u.username || "") +
    " · #" + esc(u.tokenId) + (addr ? " · " + esc(addr) : "") + "</div>";
  if (dep !== null) {
    h += '<div class="deposit-card"><img src="assets/logo.jpg" alt=""><div><div class="dk">' + esc(t().deposit) + '</div><div class="dv">' + esc(dep) + "</div></div></div>";
  }
  h += '<div class="prof-stats">';
  if (typeof u.followingCount === "number") h += "<span><b>" + fmtCount(u.followingCount) + "</b> " + esc(t().following) + "</span>";
  h += "<span><b>" + fmtCount(u.followerCount || 0) + "</b> " + esc(t().followers) + "</span>";
  h += "<span><b>" + fmtCount(u.likesReceivedCount || 0) + "</b> " + esc(t().likesGot) + "</span>";
  h += "</div></div>";
  h += '<div class="prof-tabs">' + PROF_TABS.map(function (tab) {
    return '<button type="button" data-proftab="' + tab + '"' + (p.tab === tab ? ' class="on"' : "") + ">" + esc(t()[tab]) + "</button>";
  }).join("") + "</div>";
  var f = profFeed(p);
  if (f.error && !f.items.length) h += '<div class="state-box center"><p class="err">' + esc(t().feedErr) + "</p></div>";
  else if (!f.items.length && !f.loading) h += '<div class="state-box center"><p>' + esc(t().noPosts) + "</p></div>";
  else h += f.items.map(postHtml).join("");
  if (f.items.length && !f.done) {
    h += '<button class="showmore" id="profMore" type="button"' + (f.loading ? " disabled" : "") + ">" + esc(f.loading ? t().loading : t().loadMore) + "</button>";
  }
  el.innerHTML = h;
}
function loadProfileFeed(more) {
  var p = state.profile;
  if (!p || !p.user || !p.user.username) return;
  var f = profFeed(p);
  if (f.loading) return;
  f.loading = true;
  var q = "/api/caws?limit=30&user=" + encodeURIComponent(p.user.username) +
    (p.tab !== "posts" ? "&filter=" + p.tab : "") +
    (more && f.cursor ? "&cursor=" + encodeURIComponent(f.cursor) : "");
  api(q).then(function (b) {
    var items = (b && b.items) || [];
    f.items = more ? f.items.concat(items) : items;
    f.cursor = (b && b.nextCursor) || null;
    f.done = !(b && b.nextCursor);
    f.loaded = true;
    f.error = false;
  }).catch(function () { f.error = true; })
    .finally(function () { f.loading = false; if (state.route.name === "profile") renderProfile(); });
}
function openProfile(username) {
  state.profile = {
    username: username, user: null, loading: true, error: false, tab: "posts",
    feeds: { posts: freshFeed(), replies: freshFeed(), likes: freshFeed() },
  };
  renderProfile();
  api("/api/users/" + encodeURIComponent(username)).then(function (b) {
    state.profile.user = (b && (b.user || b)) || null;
    if (!state.profile.user) state.profile.error = true;
  }).catch(function () { state.profile.error = true; })
    .finally(function () {
      state.profile.loading = false;
      renderProfile();
      loadProfileFeed(false);
    });
}
function freshFeed() { return { items: [], cursor: null, done: false, loading: false, loaded: false, error: false }; }
function openProfileByToken(tokenId) {
  api("/api/users/by-token/" + encodeURIComponent(tokenId)).then(function (b) {
    var u = (b && (b.user || b)) || null;
    if (u && u.username) location.hash = "#/user/" + encodeURIComponent(u.username);
  }).catch(function () {});
}

/* ---------- routing ---------- */
function parseRoute() {
  var h = location.hash.replace(/^#\/?/, "");
  var parts = h.split("/").filter(function (x) { return x !== ""; });
  if (!parts.length) return { name: "home" };
  if (parts[0] === "explore") return { name: "explore" };
  if (parts[0] === "bookmarks") return { name: "bookmarks" };
  if (parts[0] === "post" && parts[1]) return { name: "thread", id: decodeURIComponent(parts[1]) };
  if (parts[0] === "user" && parts[1]) return { name: "profile", username: decodeURIComponent(parts[1]) };
  return { name: "home" };
}
function routeKey(r) { return r.name + ":" + (r.id || r.username || ""); }
function applyRoute() {
  var r = parseRoute();
  var changed = routeKey(r) !== routeKey(state.route);
  state.route = r;
  state.navCount += 1;
  syncChrome();
  if (r.name === "home") {
    renderHome();
    if (state.node && !state.feed.items.length && !state.feed.loading && !state.feed.done) loadFeed(false);
  } else if (r.name === "explore") {
    renderExplore();
    loadNames();
  } else if (r.name === "bookmarks") {
    renderBookmarks();
  } else if (r.name === "thread") {
    if (changed || !state.thread || state.thread.id !== r.id) openThread(r.id);
    renderThread();
  } else if (r.name === "profile") {
    if (changed || !state.profile || state.profile.username !== r.username) openProfile(r.username);
    else renderProfile();
  }
  window.scrollTo(0, 0);
}
function syncChrome() {
  var r = state.route;
  var title = t().home;
  var back = false;
  if (r.name === "explore") title = t().explore;
  else if (r.name === "bookmarks") title = t().bookmarks;
  else if (r.name === "thread") { title = t().post; back = true; }
  else if (r.name === "profile") {
    title = state.profile && state.profile.user ? displayName(state.profile.user) : (r.username ? "@" + r.username : t().home);
    back = true;
  }
  document.getElementById("centerTitle").textContent = title;
  document.getElementById("backBtn").classList.toggle("show", back);
  document.querySelectorAll("[data-nav]").forEach(function (a) {
    a.classList.toggle("on", a.getAttribute("data-nav") === r.name);
  });
  renderNodeBox();
}
function renderNodeBox() {
  var box = document.getElementById("nodeBox");
  var host = document.getElementById("nodeHost");
  var meta = document.getElementById("nodeMeta");
  var retry = document.getElementById("retryBtn");
  if (state.node) {
    box.classList.add("on");
    host.textContent = state.node.replace(/^https?:\/\//, "");
    meta.textContent = t().nodeOn + " · " + t().network + " " + EXPECTED_NETWORK_ID;
    retry.classList.add("hidden");
  } else {
    box.classList.remove("on");
    host.textContent = t().nodeSearching;
    meta.textContent = "";
    retry.textContent = t().retry;
    retry.classList.toggle("hidden", !state.discovered);
  }
}
function applyStaticTexts() {
  document.documentElement.lang = lang === "jp" ? "ja" : "en";
  document.getElementById("brandSub").textContent = t().brandSub;
  document.getElementById("navHome").textContent = t().home;
  document.getElementById("navExplore").textContent = t().explore;
  document.getElementById("navBookmarks").textContent = t().bookmarks;
  document.getElementById("navOpenApp").textContent = t().openApp;
  document.getElementById("getAppBtn").textContent = t().getAppBtn;
  document.getElementById("railSearchInput").placeholder = t().searchPh;
  document.getElementById("railNamesTitle").textContent = t().namesToExplore;
  document.getElementById("railNamesMore").textContent = t().loadMore;
  document.getElementById("aboutTitle").textContent = t().aboutTitle;
  document.getElementById("aboutBody").textContent = t().aboutBody;
  document.getElementById("aboutLink").textContent = t().about;
  document.getElementById("transparencyLink").textContent = t().transparency;
  document.getElementById("footAbout").textContent = t().about;
  document.getElementById("footNames").textContent = t().namesDir;
  document.getElementById("footTransparency").textContent = t().transparency;
  document.getElementById("footNote").textContent = t().footerNote;
  document.getElementById("langToggle").textContent = lang === "jp" ? "EN" : "日本語";
  var dark = document.documentElement.dataset.theme === "dark";
  document.getElementById("themeToggle").textContent = dark ? (lang === "jp" ? "白背景" : "Light") : (lang === "jp" ? "黒背景" : "Dark");
  document.getElementById("backBtn").setAttribute("aria-label", t().back);
}

/* ---------- events ---------- */
document.getElementById("langToggle").addEventListener("click", function () {
  lang = lang === "jp" ? "en" : "jp";
  try { localStorage.setItem("ethcaw-web-lang", lang); } catch (e) {}
  applyStaticTexts();
  applyRoute();
  renderRailNames();
});
document.getElementById("themeToggle").addEventListener("click", function () {
  var rootEl = document.documentElement;
  if (rootEl.dataset.theme === "dark") { delete rootEl.dataset.theme; try { localStorage.removeItem("guppy-theme"); } catch (e) {} }
  else { rootEl.dataset.theme = "dark"; try { localStorage.setItem("guppy-theme", "dark"); } catch (e) {} }
  applyStaticTexts();
});
document.getElementById("retryBtn").addEventListener("click", function () { boot(); });
document.getElementById("backBtn").addEventListener("click", function () {
  if (state.navCount > 1 && history.length > 1) history.back();
  else location.hash = "#/";
});
document.getElementById("railNamesMore").addEventListener("click", function () { location.hash = "#/explore"; });
document.getElementById("railSearch").addEventListener("submit", function (e) {
  e.preventDefault();
  var q = document.getElementById("railSearchInput").value.trim();
  state.search.q = q;
  state.search.items = null;
  if (q) {
    state.search.loading = true;
    api("/api/users/search/" + encodeURIComponent(q) + "?limit=15").then(function (b) {
      state.search.items = (b && (b.users || b)) || [];
    }).catch(function () { state.search.items = []; })
      .finally(function () { state.search.loading = false; if (state.route.name === "explore") renderExplore(); });
  }
  if (state.route.name === "explore") renderExplore();
  else location.hash = "#/explore";
});
document.getElementById("railNames").addEventListener("click", function (e) {
  var named = e.target.closest("[data-open-user]");
  if (named && named.getAttribute("data-open-user")) location.hash = "#/user/" + encodeURIComponent(named.getAttribute("data-open-user"));
});
document.addEventListener("click", function (e) {
  if (e.target.closest("a")) return; // let real links (incl. linkified URLs) work
  var bm = e.target.closest("[data-bookmark]");
  if (bm) {
    e.stopPropagation();
    var id = bm.getAttribute("data-bookmark");
    var nowOn = toggleBookmark(id);
    refreshBookmarkButtons(id);
    if (state.route.name === "bookmarks" && !nowOn) renderBookmarks();
    return;
  }
  if (e.target.closest("#feedMore")) { loadFeed(true); return; }
  if (e.target.closest("#threadMore")) { loadThread(state.thread.id, true); return; }
  if (e.target.closest("#profMore")) { loadProfileFeed(true); return; }
  var pt = e.target.closest("[data-proftab]");
  if (pt) {
    var p = state.profile;
    if (p && p.tab !== pt.getAttribute("data-proftab")) {
      p.tab = pt.getAttribute("data-proftab");
      renderProfile();
      if (!profFeed(p).loaded) loadProfileFeed(false);
    }
    return;
  }
  var usr = e.target.closest("[data-open-user]");
  if (usr && usr.getAttribute("data-open-user")) {
    location.hash = "#/user/" + encodeURIComponent(usr.getAttribute("data-open-user"));
    return;
  }
  var post = e.target.closest("[data-open-post]");
  if (post) {
    location.hash = "#/post/" + encodeURIComponent(post.getAttribute("data-open-post"));
  }
});
window.addEventListener("hashchange", applyRoute);

/* ---------- boot ---------- */
function boot() {
  state.node = null;
  state.discovered = false;
  state.feed = { items: [], cursor: null, done: false, loading: false, error: false };
  state.names = { items: null, loading: false, error: false };
  applyRoute();
  discover().then(function (node) {
    state.node = node;
    state.discovered = true;
    syncChrome();
    applyRoute();
    if (node) {
      if (!state.feed.items.length) loadFeed(false);
      loadNames();
    }
  });
}
hydrateIcons(document);
applyStaticTexts();
(function () {
  var userParam = null;
  try { userParam = new URLSearchParams(location.search).get("user"); } catch (e) {}
  if (userParam && !location.hash) location.hash = "#/user/" + encodeURIComponent(userParam);
})();
applyRoute();
boot();
// While no node is online, keep looking quietly — the first node to come
// up fills this page automatically.
setInterval(function () {
  if (!state.node && state.discovered) {
    discover().then(function (node) {
      if (node) {
        state.node = node;
        syncChrome();
        applyRoute();
        loadFeed(false);
        loadNames();
      }
    });
  }
}, 60000);
</script>
</body>
